id: os-opendata
type: dataset
title: Ordnance Survey OpenData (Boundary-Line, Code-Point Open, Open Names, Terrain and other open products)
description: |
  Great Britain's national mapping agency's free open data range, downloaded from the OS Data Hub: administrative and electoral boundaries (Boundary-Line), postcode centroids (Code-Point Open), gazetteer, elevation and small-scale base mapping, alongside open products from partners such as the British Geological Survey.
