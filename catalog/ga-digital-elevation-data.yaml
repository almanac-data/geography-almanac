id: ga-digital-elevation-data
type: dataset
title: Geoscience Australia Digital Elevation Data (Elvis and national DEMs)
description: |
  Geoscience Australia's hub for Australian elevation and bathymetry: the Elvis Elevation and Depth portal (open LiDAR and DEM data from Commonwealth, state and territory agencies under ICSM), plus packaged national products such as the SRTM-derived 1 second and 3 second DEMs, the 5 m LiDAR-derived DEM and 5 m drainage-catchment DEMs.
