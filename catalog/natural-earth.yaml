id: natural-earth
type: dataset
title: Natural Earth (public-domain small-scale world map data)
description: |
  Public-domain vector and raster world map data at 1:10m, 1:50m and 1:110m scales: country and first-level subdivision boundaries (including disputed-area treatments), populated places, coastlines, rivers, lakes, relief and other cultural and physical themes, generalised so that layers align. A de facto default for small-scale world and regional maps, made by volunteers rather than an official mapping agency.
publisher: Natural Earth (volunteer project; primary authors Tom Patterson and Nathaniel Vaughn Kelso; supported by the North American Cartographic Information Society, NACIS)
