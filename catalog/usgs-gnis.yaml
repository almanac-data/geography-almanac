id: usgs-gnis
type: dataset
title: USGS Geographic Names Information System (GNIS)
description: |
  The Federal and national standard gazetteer of US geographic names, maintained by the USGS for the U.S. Board on Geographic Names: the official name, feature class, location and variant names of physical and cultural features in the United States, its territories and Antarctica (excluding roads and highways). The authoritative source for US place-name spelling and feature IDs.
