id: inegi-marco-geoestadistico
type: dataset
title: INEGI Marco Geoestadístico (Mexico Geostatistical Framework)
description: |
  Mexico's national geostatistical framework from INEGI: the official division of the country into states (AGEE), municipalities (AGEM), basic geostatistical areas (AGEB), localities and urban blocks, used to geo-reference every census and survey. The boundary set Mexican statistics are published against.
