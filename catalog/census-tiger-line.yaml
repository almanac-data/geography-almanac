id: census-tiger-line
type: dataset
title: US Census Bureau TIGER/Line Shapefiles
description: |
  The Census Bureau's annual extracts of its MAF/TIGER geographic database: legal and statistical boundaries (states, counties, county subdivisions, places, tracts, block groups, blocks, congressional and legislative districts, ZCTAs, PUMAs and more), roads, rail, hydrography and landmarks, with the geographic codes that join to Census data. The standard boundary files behind US statistics.
