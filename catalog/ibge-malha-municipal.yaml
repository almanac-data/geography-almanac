id: ibge-malha-municipal
type: dataset
title: IBGE Malha Municipal (Brazil municipal and state boundary files)
description: |
  IBGE's official digital boundary files for Brazil's political-administrative division: municipalities, states (Unidades da Federação), immediate and intermediate geographic regions, major regions and the country outline, revised each year from new legislation, court decisions and state boundary reports. The boundary set used for the census and all IBGE surveys.
publisher: Instituto Brasileiro de Geografia e Estatística (IBGE)
