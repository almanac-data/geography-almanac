notes: |
  Human-verified 2026-11-01: HTTP 200 in headless Chromium, page "Malha Municipal | IBGE", but only after a Cloudflare "Just a moment..." challenge cleared (about 20 seconds' wait, with a desktop Chrome user agent); curl with a browser User-Agent and a quick headless load both got HTTP 403. The "O que é" tab says the product "retrata a situação vigente da Divisão Político Administrativa (DPA), através da representação vetorial das linhas definidoras das divisas estaduais e limites municipais, utilizada na coleta dos Censos Demográficos e demais pesquisas do IBGE". "Sobre a publicação - 2025" says the 2025 edition has 5573 geocodes (5569 municipalities plus DF, Fernando de Noronha and two operational lagoon areas), is in Shapefile format, SIRGAS 2000 geographic coordinates, UTF-8. Download links go to https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2025/ (HTTP 200 to curl, no challenge), e.g. Brasil/BR_Municipios_2025.zip.
  Licence checked 2026-11-01: not verified. Neither the product page nor the geoftp folder listing carries a licence statement. The page points to a PDF, "Malha Municipal Digital e Áreas Territoriais 2025: Informações Técnicas e Legais para a Utilização dos Dados Publicados" (https://biblioteca.ibge.gov.br/index.php/biblioteca-catalogo?view=detalhes&id=2102268), which may contain usage terms but wasn't read. Other IBGE entries in this workspace also leave the licence unverified. The attribution follows Brazilian convention and isn't a quoted IBGE requirement. Not checked: the zip contents, the census-tract (setores censitários) meshes, and IBGE's geoservices.
