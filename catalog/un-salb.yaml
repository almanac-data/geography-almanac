id: un-salb
type: dataset
title: UN Second Administrative Level Boundaries (SALB)
description: |
  United Nations programme that collects, from each Member State's national geospatial information authority, the structure, names and boundaries of administrative units down to the second subnational level, with historical tables of changes over time. The reference point for comparable subnational geographies across countries.
publisher: United Nations Statistics Division and Geospatial Information Section (SALB programme)
jurisdiction:
  scope: multilateral
  country: null
