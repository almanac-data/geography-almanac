id: copernicus-clms-corine-land-cover
type: dataset
title: Copernicus Land Monitoring Service CORINE Land Cover
description: |
  Pan-European land cover and land use inventory in 44 thematic classes, produced for reference years 1990, 2000, 2006, 2012 and 2018 with change layers between them, at a 25 ha minimum mapping unit. The standard harmonised land cover base for Europe, run by the European Environment Agency under the EU's Copernicus programme.
