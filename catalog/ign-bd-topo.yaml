id: ign-bd-topo
type: dataset
title: IGN BD TOPO (France 3D topographic vector database)
description: |
  France's national topographic reference database from the Institut national de l'information géographique et forestière (IGN): a metre-precision 3D vector description of administrative units, buildings, hydrography, named places, land cover, services, transport and regulated zones, with stable object identifiers and quarterly editions. Distributed as open data through the Géoplateforme (cartes.gouv.fr).
