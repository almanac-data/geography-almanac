notes: |
  Human-verified 2026-11-01: HTTP 200 (curl; content read with headless Chromium). The old address https://geoservices.ign.fr/bdtopo redirects to this cartes.gouv.fr page, which is catalogued. The page reads "La BD TOPO® version 3.5 contient une description vectorielle 3D (structurée en objets) des éléments du territoire et de ses infrastructures, de précision métrique", lists the themes (administratif, bâti, hydrographie, lieux nommés, occupation du sol, services et activités, transport, zones réglementées), shows "Last updated 10 days ago", and also describes the weekly BD TOPO Express and the quarterly Différentiel. The Géoplateforme download feed (https://data.geopf.fr/telechargement/resource/BDTOPO) listed, for Paris (D075), 3.5 all-themes files in GPKG and SHP (Lambert-93) dated 2025-12-15, 2026-03-15, 2026-06-15 and 2026-09-15, plus older 2.0 editions.
  Licence checked 2026-11-01: the licence accordion on the page would not expand in headless Chromium, so the licence was read from the dataset's ISO 19139 record via the Géoplateforme CSW (https://data.geopf.fr/csw?service=CSW&version=2.0.2&request=GetRecordById&id=IGNF_BD-TOPO&outputSchema=http://www.isotc211.org/2005/gmd&elementSetName=full), whose useConstraints read "Licence Ouverte / Open License (compatible ODC-BY, CC-BY 2.0)" linking https://www.etalab.gouv.fr/wp-content/uploads/2018/11/open-licence.pdf. This is dataset-level metadata. The licence version number wasn't stated in the record. Not checked: the exact attribution wording IGN requests, or the WMTS/WFS services in detail.
