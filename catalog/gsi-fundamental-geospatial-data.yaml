notes: |
  Human-verified 2026-11-01: HTTP 200 in headless Chromium only. curl failed on both www.gsi.go.jp and service.gsi.go.jp with "unsafe legacy renegotiation disabled" (an OpenSSL TLS incompatibility on GSI's servers, not a block), so this source needs the headless rung. The page "基盤地図情報サイト" (last updated 2026-03-07) links to the download service and says "基盤地図情報をダウンロードする場合には、ダウンロードページでユーザ登録とログインが必要です" (registration and login are required to download). The download service (https://service.gsi.go.jp/kiban/) showed notices "2026-10-30 提供データを整備・更新しました（基本項目）" and "2026-07-31 ... （数値標高モデル）", and that the coordinate reference system changed from JGD2011 to JGD2024. GSI also offers a free viewer (FGDV) that exports to Shapefile.
  Licence checked 2026-11-01: GSI's Content Terms of Use (https://www.gsi.go.jp/kikakuchousei/kikakuchousei40182.html, revised 令和7年11月20日) state "本サイトのコンテンツには特段の記載が無い限り公共データ利用規約（第1.0 版）（PDL1.0）が適用されています" (site content is under Public Data License v1.0 unless otherwise stated), with a source credit such as "出典：国土地理院ウェブサイト（当該ページのURL）" and a note when content is edited. The same page also mentions applications under the Survey Act (測量法) for copying or using basic survey results, so some uses of this data may need GSI approval; that wasn't worked through. This is a site-wide terms page, not a dataset-specific licence. Not checked: native file formats (GML/JPGIS per the spec, not verified) or the login flow. Format is left empty.
  Canonical URL moved 2026-11-01 from https://www.gsi.go.jp/kiban/ to GSI's own download service, https://service.gsi.go.jp/kiban/ (基盤地図情報ダウンロードサービス, the same Fundamental Geospatial Data). www.gsi.go.jp needs TLS 'unsafe legacy renegotiation', which modern OpenSSL refuses, so the link checker could never reach it (issue #16). The download service answered HTTP 200 to plain curl the same day.
