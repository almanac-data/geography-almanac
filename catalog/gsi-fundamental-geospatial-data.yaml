id: gsi-fundamental-geospatial-data
type: dataset
title: GSI Japan Fundamental Geospatial Data (Kiban Chizu Joho)
description: |
  Japan's national framework geospatial data from the Geospatial Information Authority of Japan (GSI), defined under the Basic Act on the Advancement of Utilizing Geospatial Information: basic items such as administrative boundaries, coastlines, roads, buildings and geodetic control points, plus digital elevation models (including 1 m, 5 m and 10 m meshes), downloadable nationwide.
publisher: Geospatial Information Authority of Japan (GSI), Ministry of Land, Infrastructure, Transport and Tourism
