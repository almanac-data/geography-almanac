id: usgs-the-national-map
type: dataset
title: USGS The National Map (3DEP elevation, hydrography, boundaries and topographic base data)
description: |
  The USGS National Geospatial Program's suite of nationally consistent base geospatial layers for the United States: 3D Elevation Program (3DEP) lidar and DEMs, hydrography (National Hydrography Dataset and its 3D Hydrography Program successor), boundaries, transportation, structures, geographic names, land cover and orthoimagery, plus US Topo and historical topographic maps, delivered through the TNM Downloader and web services.
