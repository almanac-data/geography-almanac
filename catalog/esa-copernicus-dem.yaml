id: esa-copernicus-dem
type: dataset
title: Copernicus DEM (GLO-30, GLO-90 and EEA-10 Digital Elevation Model)
description: |
  Global digital surface model derived from the TanDEM-X mission (2011-2015), distributed by the European Space Agency under the EU Copernicus programme at 30 m and 90 m worldwide (GLO-30, GLO-90) and 10 m over 39 European countries (EEA-10). The most widely used open global elevation baseline after SRTM.
publisher: European Space Agency (ESA), Copernicus Contributing Missions, via the Copernicus Data Space Ecosystem
