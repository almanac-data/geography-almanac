notes: |
  Human-verified 2026-11-01: HTTP 200 (curl and headless Chromium). The Open Government Portal record "Topographic Data of Canada - CanVec Series" states "CanVec contains more than 60 topographic features classes organized into 8 themes: Transport Features, Administrative Features, Hydro Features, Land Features, Manmade Features, Elevation Features, Resource Management Features and Toponymic Features." Publisher shown as Natural Resources Canada. Metadata: Date Published 2019-03-01, Record Modified 2025-12-22, Temporal Coverage 1944-01-01 to 2019-01-01, Status "Completed", Maintenance and Update Frequency "Not Planned", so this may be a frozen product rather than a maintained one; worth watching. Resources include prepackaged FGDB and Shapefile download directories, KMZ, WMS and the Geospatial Data Extraction Tool. The legacy geobase.ca host reset the connection, and no NRCan product page was used as the canonical URL because the old NRCan topographic map URLs returned 404.
  Licence checked 2026-11-01: the portal record shows "Licence: Open Government Licence - Canada", and the CKAN API (package_show) gives license_url https://open.canada.ca/en/open-government-licence-canada. This is a dataset-level licence field on the official portal. The licence version wasn't read from the licence page; GeoGratis (https://geogratis.gc.ca/) has its own "Terms and conditions of use" that weren't read. Not checked: the download directories themselves, or newer NRCan products (Canadian Digital Elevation Model, National Hydro Network), which are separate records.
