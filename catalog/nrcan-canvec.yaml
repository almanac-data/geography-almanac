description: |
  Natural Resources Canada's multiscale national topographic vector dataset, the successor to the GeoBase and National Topographic Data Base layers: more than 60 feature classes in eight themes covering transport, administrative boundaries, hydrography, land cover, built features, elevation, resource management and place-name labels.
