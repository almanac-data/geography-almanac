id: eurostat-gisco-geodata
type: dataset
title: Eurostat GISCO Geodata (NUTS, LAU, countries, communes and other reference layers)
description: |
  Eurostat's Geographic Information System of the Commission (GISCO) distributes the EU's reference geographies: NUTS regions, local administrative units (LAU), communes, countries, postal codes, census and coastal units, cities and functional urban areas, plus grids, transport networks, land cover and elevation layers. NUTS and LAU are the boundary sets that EU regional statistics are published against.
